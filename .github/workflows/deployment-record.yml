name: Record Deployment

# Writes deploy history to the GitHub Deployments API.
#
# This exists because DORA metrics need a deployment EVENT, and a GitOps
# pipeline does not naturally produce one — the pipeline's last act is a git
# commit, and the actual deploy happens later, inside ArgoCD, with nothing
# writing it down. Without a record you can count commits or count image
# builds, neither of which is a deployment.
#
# The Deployments API is used rather than a database because it is already
# authenticated, already audited, already has a UI (the Environments tab),
# and survives this cluster being torn down. dora-exporter reads it back.
#
# Lead time is computed from the commit's authored timestamp, not the
# workflow's start time: lead time for changes is code-committed to
# code-running, and measuring from CI start quietly deletes however long the
# change sat in review.

on:
  workflow_call:
    inputs:
      image_tag:
        description: The tag that was deployed (e.g. sha-abc1234)
        required: true
        type: string
      environment:
        description: Target environment
        required: false
        default: production
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect commit facts
        id: facts
        run: |
          set -eu
          # Authored time, not committed time: a rebase rewrites the latter.
          echo "committed_at=$(git log -1 --format=%aI)" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --format=%an)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Create deployment record
        uses: actions/github-script@v9
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMMITTED_AT: ${{ steps.facts.outputs.committed_at }}
          COMMIT_AUTHOR: ${{ steps.facts.outputs.author }}
          COMMIT_SUBJECT: ${{ steps.facts.outputs.subject }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.ENVIRONMENT,
              // This pipeline has already gated on tests, scans and policy.
              // Leaving required_contexts populated would make GitHub wait for
              // check runs that, by this point, have finished.
              required_contexts: [],
              auto_merge: false,
              description: process.env.COMMIT_SUBJECT?.slice(0, 140),
              payload: {
                image_tag: process.env.IMAGE_TAG,
                committed_at: process.env.COMMITTED_AT,
                author: process.env.COMMIT_AUTHOR,
                workflow_run: context.runId,
                rollback: false,
              },
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'manifests committed; ArgoCD auto-sync will reconcile',
            });

            core.summary
              .addHeading('Deployment recorded', 3)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Environment', process.env.ENVIRONMENT],
                ['Image tag', process.env.IMAGE_TAG],
                ['Commit', context.sha.slice(0, 7)],
                ['Committed at', process.env.COMMITTED_AT],
                ['Deployment id', String(deployment.data.id)],
              ])
              .write();
