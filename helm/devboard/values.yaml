nameOverride: ""
fullnameOverride: ""
observability:
  enabled: true
  otlpGrpcEndpoint: otel-collector-gateway.observability.svc.cluster.local:4317
  otlpHttpEndpoint: http://otel-collector-gateway.observability.svc.cluster.local:4318
externalSecrets:
  enabled: true
  secretKey: devboard/postgres
  storeName: aws-secrets-manager
  refreshInterval: 1h
postgres:
  image: postgres:16-alpine
  serviceName: postgres
  storage:
    size: 1Gi
    storageClassName: "gp3"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
# ---------------------------------------------------------------------------
# Image coordinates below are CI-MANAGED, with one deliberate exception.
#
# These point at trainwithshubham/* — the UPSTREAM images — on purpose. They
# are what the running cluster serves today, and sha-4945e5b exists under that
# account, so the chart deploys as-is. Pointing them at manishjha18/* would
# ImagePullBackOff, because the pipeline has not published its own images yet
# (docker-push is blocked behind the Trivy CRITICAL gate).
#
# HOWEVER: .github/workflows/gitops-bump.yml rewrites BOTH repository and tag
# on every successful pipeline run, using vars.DOCKERHUB_USERNAME as the owner.
# So the first green pipeline will move these to that account and this comment
# will be stale. That is the intended end state — CI owning its own artifacts —
# not a bug. If you want to stay on upstream images permanently, remove the
# `.repository =` assignments from that workflow's yq expressions; leaving the
# `.tag =` ones alone keeps deployments tracking CI.
# ---------------------------------------------------------------------------
backend:
  image:
    repository: manishjha18/devboard-backend
    tag: sha-70ff304
    pullPolicy: IfNotPresent
  replicas: 1
  serviceName: backend
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
frontend:
  image:
    repository: manishjha18/devboard-frontend
    tag: sha-70ff304
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 4173
  servicePort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  # Left empty on purpose. The Kyverno restricted-security-context policy will
  # flag this in Audit mode, which is the correct outcome: the finding is real.
  # Filling these in without first confirming the image runs as non-root turns
  # an audit finding into a CrashLoopBackOff. Verify with:
  #   docker run --rm --user 65532 manishjha18/devboard-frontend:<tag>
  # then set:
  #   podSecurityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
  #   securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: false}
  podSecurityContext: {}
  securityContext: {}
  # ---- progressive delivery -------------------------------------------
  rollout:
    # Replaces the frontend Deployment with an Argo Rollout. Requires the
    # argo-rollouts platform app (gitops/argocd/platform/argo-rollouts.yaml).
    enabled: true
    # How many old ReplicaSets to keep. This is the rollback depth: Argo
    # Rollouts can undo to any revision still in history, so 5 means the last
    # five deploys are recoverable in seconds.
    revisionHistoryLimit: 5
    # Keep the previous ReplicaSet warm for 30s after an abort so rollback is
    # instant rather than a cold start.
    abortScaleDownDelaySeconds: 30
    # 20% -> watch -> 50% -> watch -> 100%. Each pause is a window for the
    # AnalysisRun to fail the rollout before it widens.
    steps:
      - setWeight: 20
      - pause:
          duration: 2m
      - setWeight: 50
      - pause:
          duration: 2m
      - setWeight: 100
    analysis:
      prometheusAddress: http://prometheus-operated.observability.svc.cluster.local:9090
      # The Envoy Gateway's span-metrics identity. Confirmed present in
      # Prometheus; see the note in frontend-analysistemplate.yaml about why
      # this is a blended signal rather than canary-only.
      gatewayServiceName: devboard-gateway.devboard
      window: 2m
      initialDelay: 60s
      interval: 60s
      count: 5
      failureLimit: 1
      # 0.95 tolerates a fully-broken canary at setWeight 20 for exactly one
      # sample before aborting. Tighten once traffic routing gives per-version
      # attribution.
      minSuccessRate: "0.95"
      maxLatencyP95Ms: 1500
ai:
  enabled: true
  image:
    repository: manishjha18/devboard-ai-service
    tag: sha-70ff304
    pullPolicy: IfNotPresent
  replicas: 1
  serviceName: ai-service
  port: 3005
  taskServiceUrl: http://backend:8080
  ollamaUrl: http://ollama.ollama.svc.cluster.local:11434/v1
  modelName: llama3.2:1b
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
gateway:
  enabled: true
  className: envoy
  listenerPort: 80
  # Empty accepts any Host, which is what the raw load balancer URL needs.
  hostname: ""
  # Off by default: the chart must still work with no cert-manager and no domain.
  tls:
    enabled: false
    port: 443
    # Must be in the Gateway's namespace. Empty -> "<fullname>-tls".
    secretName: ""
    createCertificate: true
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
    httpsRedirect: true
# The shared ClusterIssuers in gitops/cert-manager/ hard-wire their solver to the
# RAW stack's Gateway, so the Helm stack needs its own Issuer. Each stack gets
# its own load balancer, so they need separate hostnames and DNS records.
certManager:
  createIssuer: false
  issuerName: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  email: trainwithshubham@gmail.com
