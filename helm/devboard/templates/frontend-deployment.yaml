{{- if not .Values.frontend.rollout.enabled }}
{{/*
The plain Deployment path. Rendered only when frontend.rollout.enabled is
false, because a Deployment and a Rollout that both select
app: devboard-frontend would fight over the same pods — two controllers, one
label selector, endless scale up/scale down.

Keep this in step with frontend-rollout.yaml's pod template. If they drift, the
behaviour of a release changes depending on a flag that is only supposed to
affect rollout strategy.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devboard.fullname" . }}-frontend
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
    app: devboard-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        {{- include "devboard.labels" . | nindent 8 }}
        app: devboard-frontend
    spec:
      containers:
        - name: devboard-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- with .Values.frontend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
