# Serves the built SPA and forwards /api to the Go backend.
#
# This replaces `vite preview`, which did both jobs but required the whole of
# node_modules — devDependencies included — to be present at runtime. That is
# how esbuild's Go binary ended up in the production image carrying CVEs from a
# Go toolchain nothing here ever executes.
#
# Installed at /etc/nginx/conf.d/default.conf, replacing the image's default.
# The base image's nginx.conf already includes that directory.

server {
    # 4173 was vite preview's port. Kept deliberately so no Kubernetes manifest
    # has to change: containerPort, both probes and the Service targetPort all
    # still line up.
    listen       4173;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # vite preview enforced an allowedHosts list as a DNS-rebinding defence,
    # which is a dev-server concern: it protects a browser on a developer's
    # machine from a hostile page reaching their localhost server. nginx serving
    # static files behind a Gateway has no such exposure, so there is no
    # equivalent here and any Host is accepted — the same as any other origin
    # server. That also removes the failure mode where probes passed on the pod
    # IP while browsers got 403 on the real domain.

    # React Router owns the URL space. Any path that is not a real file must
    # return index.html so the client-side router can handle it; without this a
    # refresh on /projects/42 is a hard 404. vite preview did this implicitly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for the hashed build assets, which are immutable by
    # construction. index.html is deliberately excluded — it is the file that
    # points at the new hashes, so caching it would pin clients to an old build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The same mapping vite.preview.config.js performed:
    #     /api/tasks  ->  http://backend:8080/tasks
    # The TRAILING SLASH on proxy_pass is what strips the /api prefix. Remove it
    # and every request arrives at the backend still prefixed with /api, which
    # 404s on a service that never expected it.
    #
    # There is deliberately NO /api/ai rule, matching the original config: the
    # Gateway's HTTPRoute matches those paths exactly and routes them straight
    # to ai-service, so they never reach this container. Adding a prefix rule
    # here would be a second, independent door into ai-service that bypasses
    # those exact matches.
    #
    # STARTUP DEPENDENCY, and the one real behavioural change from vite preview.
    #
    # nginx resolves a literal upstream hostname once, at config load. If
    # `backend` does not resolve, nginx refuses to start:
    #
    #     nginx: [emerg] host not found in upstream "backend"
    #
    # so the pod CrashLoopBackOffs rather than serving the UI with a broken API.
    # vite preview resolved per request, so it started regardless and only the
    # API calls failed.
    #
    # In practice the backend Service ships in the same chart and the same
    # namespace, so it exists; and if it briefly does not, the kubelet restarts
    # the pod until it does. But on a first install into an empty namespace the
    # frontend can crash-loop for a few seconds while the Service is created.
    #
    # The nginx fix for this — a `resolver` plus a variable in proxy_pass, so
    # resolution is deferred to request time — is not usable here: nginx's
    # resolver ignores the search domains in /etc/resolv.conf, so the short name
    # `backend` would never resolve and only a namespace-qualified FQDN would
    # work. This chart deploys into both `devboard` and `devboard-helm`, so
    # there is no single FQDN to hard-code.
    #
    # If the crash-loop window is ever a problem, the better fix is to stop
    # proxying here at all and give the Gateway an /api rule to the backend,
    # alongside the /api/ai rules it already owns.
    location /api/ {
        proxy_pass http://backend:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The base image is distroless and runs as UID 65532; buffering would
        # have nginx spool responses through /var/cache/nginx, which that user
        # may not own. Streaming straight through avoids depending on it. The
        # payloads here are small JSON documents, so there is nothing to gain
        # from buffering anyway.
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
