apiVersion: v1
kind: Service
metadata:
  name: dora-exporter
  namespace: dora
  labels:
    app: dora-exporter
    app.kubernetes.io/part-of: devboard
spec:
  type: ClusterIP
  selector:
    app: dora-exporter
  ports:
    # Named, because the ServiceMonitor matches on the port NAME.
    - name: metrics
      port: 9101
      targetPort: metrics
      protocol: TCP
