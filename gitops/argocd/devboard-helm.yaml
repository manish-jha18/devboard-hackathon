apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devboard-helm
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/manish-jha18/devboard-hackathon.git
    targetRevision: feat/full
    path: helm/devboard
    helm:
      releaseName: devboard

  destination:
    server: https://kubernetes.default.svc
    namespace: devboard-helm

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
